name: "Build tt-metal docker artifact"

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: "ubuntu-20.04-amd64"
  workflow_dispatch:
    inputs:
      os:
        required: false
        type: choice
        default: "ubuntu-20.04-amd64"
        options:
            - "ubuntu-20.04-amd64"
            - "ubuntu-22.04-amd64"

jobs:
  build-docker-image:
    env:
      TT_METAL_ENV: ${{ vars.TT_METAL_ENV }}
      CONFIG: ci
      SILENT: 0
      VERBOSE: 1
      TT_METAL_DOCKER_IMAGE: tt-metalium/${{ inputs.os }}
      TT_METAL_DOCKER_IMAGE_TAG: ghcr.io/${{ github.repository }}/tt-metalium/${{ inputs.os }}:current
    environment: dev
    runs-on:
      - build-docker
      - in-service
    steps:
      - uses: tenstorrent-metal/metal-workflows/.github/actions/checkout-with-submodule-lfs@v2.0.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get all test, doc and src files that have changed
        id: changed-files-yaml
        uses: tj-actions/changed-files@v45
        with:
          files_yaml: |
            dockerfile:
              - '**.Dockerfile'
              - dockerfile/**
            scripts:
              - scripts/**
              - docker/requirements*
              - docker/install_test_deps.sh
            pyproject:
              - pyproject.toml
            metalium:
              - tt_metal/python_env/requirements-dev.txt
          fetch_depth: '5'

      - name: Build Docker image if deps file(s) changed
        # NOTE: Ensure all outputs are prefixed by the same key used above e.g. `test_(...)` | `doc_(...)` | `src_(...)` when trying to access the `any_changed` output.
        if: steps.changed-files-yaml.outputs.test_any_changed != 'true'
        env:
          TEST_ALL_CHANGED_FILES: ${{ steps.changed-files-yaml.outputs.test_all_changed_files }}
        run: |
          ./scripts/docker/build_docker_image.sh ${{ inputs.os }} ${{ env.TT_METAL_DOCKER_IMAGE_TAG }}
      - name: Tag Docker main image as current image
        # NOTE: Ensure all outputs are prefixed by the same key used above e.g. `test_(...)` | `doc_(...)` | `src_(...)` when trying to access the `any_changed` output.
        if: steps.changed-files-yaml.outputs.test_any_changed == 'true'
        env:
          TEST_ALL_CHANGED_FILES: ${{ steps.changed-files-yaml.outputs.test_all_changed_files }}
        run: |
          docker pull ghcr.io/${{ github.repository }}/${{ env.TT_METAL_DOCKER_IMAGE }}:latest
          docker tag ghcr.io/${{ github.repository }}/${{ env.TT_METAL_DOCKER_IMAGE }}:latest ${{ env.TT_METAL_DOCKER_IMAGE_TAG }}
      - name: Determine Docker Image Tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi
      - name: Push Docker image to GitHub Container Registry
        run: |
          GITHUB_REPO_DOCKER_IMAGE_TAG=ghcr.io/${{ github.repository }}/${{ env.TT_METAL_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag ghcr.io/${{ github.repository }}/${{ env.TT_METAL_DOCKER_IMAGE }}:current $GITHUB_REPO_DOCKER_IMAGE_TAG
          docker push $GITHUB_REPO_DOCKER_IMAGE_TAG
