name: "Build tt-metal docker artifact"

on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: "ubuntu-20.04-amd64"
  workflow_dispatch:
    inputs:
      os:
        required: false
        type: choice
        default: "ubuntu-20.04-amd64"
        options:
            - "ubuntu-20.04-amd64"
            - "ubuntu-22.04-amd64"

jobs:
  build-docker-image:
    env:
      TT_METAL_ENV: ${{ vars.TT_METAL_ENV }}
      CONFIG: ci
      SILENT: 0
      VERBOSE: 1
      TT_METAL_DOCKER_IMAGE: tt-metalium/${{ inputs.os }}
    environment: dev
    runs-on:
      - build-docker
      - in-service
    steps:
      - uses: tenstorrent-metal/metal-workflows/.github/actions/checkout-with-submodule-lfs@v2.0.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: |
          ./scripts/docker/build_docker_image.sh ${{ inputs.os }}
      - name: Determine Docker Image Tag
        id: set-image
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev-${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
          fi
      - name: Push Docker image to GitHub Container Registry
        run: |
          GITHUB_REPO_DOCKER_IMAGE_TAG=ghcr.io/${{ github.repository }}/${{ env.TT_METAL_DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag ${{ inputs.os }}:latest $GITHUB_REPO_DOCKER_IMAGE_TAG
          docker push $GITHUB_REPO_DOCKER_IMAGE_TAG
