name: "Build tt-metal artifacts"

on:
  workflow_call:
    inputs:
      arch:
        required: false
        type: string
        default: '["grayskull", "wormhole_b0"]'
      build-type:
        required: false
        type: string
        default: "Release"
      tracy:
        required: false
        type: boolean
        default: false
        description: "Build with tracy enabled"
      os:
        required: false
        type: string
        default: "ubuntu-20.04-amd64"
  workflow_dispatch:
    inputs:
      arch:
        required: false
        type: string
        default: '["grayskull", "wormhole_b0"]'
      build-type:
        required: false
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
          - CI
      tracy:
        required: false
        type: boolean
        default: false
        description: "Build with tracy enabled"
      os:
        required: false
        type: choice
        default: "ubuntu-20.04-amd64"
        options:
          - "ubuntu-20.04-amd64"
          - "ubuntu-22.04-amd64"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  build-docker:
    uses: ./.github/workflows/build-docker-artifact.yaml
    secrets: inherit
    with:
      os: ${{ inputs.os }}
  build-artifact:
    needs: build-docker
    uses: ./.github/workflows/build-artifact.yaml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      build-type: ${{ inputs.build-type }}
      tracy: ${{ inputs.tracy }}
